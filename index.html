<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Love ❤️</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floating Hearts & Rose Petals -->

    <div id="floating-container"></div>



    <!-- Main Card -->

    <div class="glass-card" id="mainCard">



        <!-- Welcome Screen -->

        <div id="welcomePage">

            <div class="heart-icon">

                ❤️

            </div>

            <h1 id="typing"></h1>

            <p class="subtitle">

                Every heartbeat reminds me of you.

            </p>

            <button id="startBtn">

                Open My Heart 💌

            </button>

        </div>



        <!-- Proposal Page (JS will show) -->

        <div id="proposalPage" class="hidden"></div>



        <!-- Envelope Page (JS will show) -->

        <div id="envelopePage" class="hidden"></div>



        <!-- Letter Page (JS will show) -->

        <div id="letterPage" class="hidden"></div>



    </div>



    <!-- Footer -->

    <footer>

        Made with ❤️ by

        <span>Nazrul Islam</span>

    </footer>



    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
