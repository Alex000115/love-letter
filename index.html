<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Beloved Wife ❤️</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floating Hearts & Rose Petals -->

    <div id="floating-container"></div>



    <!-- Background Glow -->

    <div class="bg-glow glow1"></div>

    <div class="bg-glow glow2"></div>



    <!-- Main Card -->

    <main class="glass-card" id="mainCard">



        <!-- =========================
             Welcome Screen
        ========================== -->

        <section id="welcomeScreen" class="screen active">

            <div class="main-heart">

                ❤️

            </div>

            <h1 id="typing"></h1>

            <p class="subtitle">

                Every heartbeat reminds me of you...

            </p>

            <button id="startBtn">

                Open My Heart 💌

            </button>

        </section>



        <!-- =========================
             Proposal Screen
        ========================== -->

        <section id="proposalScreen" class="screen"></section>



        <!-- =========================
             Envelope Screen
        ========================== -->

        <section id="envelopeScreen" class="screen"></section>



        <!-- =========================
             Letter Screen
        ========================== -->

        <section id="letterScreen" class="screen"></section>



    </main>



    <!-- Footer -->

    <footer>

        Made with ❤️ by

        <span>Nazrul Islam</span>

    </footer>



    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
